name: Hardware report
description: Tell us whether Bango works on your Mac. This is the most useful thing you can send.
title: "Hardware report: <your Mac model>"
labels: ["hardware"]
body:
  - type: input
    id: model
    attributes:
      label: Mac model and chip
      placeholder: MacBook Air 13-inch, M2
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.1
    validations:
      required: true
  - type: dropdown
    id: sensor
    attributes:
      label: General, "This Mac" card
      description: What does it show for the accelerometer and the gyroscope?
      options:
        - Accelerometer found, gyroscope found
        - Accelerometer found, no gyroscope
        - No accelerometer found
    validations:
      required: true
  - type: dropdown
    id: taps
    attributes:
      label: Single, double and triple taps in Tuning, "Try it"
      options:
        - All recognized reliably
        - Recognized, but only after raising the sensitivity
        - Unreliable
        - Nothing recognized
    validations:
      required: true
  - type: dropdown
    id: zones
    attributes:
      label: Zones (left, right, top)
      options:
        - Not tried
        - Setup failed
        - Setup worked, but classification is often wrong
        - Works reliably
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Attach a recording from Activity, Lab if taps were missed. It holds motion numbers only, never what you typed.
