name: CI

on:
  push:
    branches: [main, 'claude/**', original-core, release-candidate]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish a GitHub release (and its v-tag) for the version in the VERSION file'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The detector, gesture rules, profiles and safety policy use only Foundation,
  # so they are tested on Linux where runners are cheap and fast.
  core-tests:
    name: TapCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  # The real app, with the same tests, on Apple Silicon.
  macos:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # For the drag-to-Applications disk image. If it fails, the build falls back to a plain image.
      - run: brew install create-dmg || true
      - run: swift --version
      - run: swift test
      - run: ./scripts/build.sh --unsigned
      # Version and commit go into the artifact names so a new build is never mistaken for an old one.
      - name: Name the build
        id: meta
        run: echo "name=$(tr -d '[:space:]' < VERSION)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Package the unsigned app
        run: ditto -c -k --keepParent dist/Bango.app dist/Bango-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bango-${{ steps.meta.outputs.name }}-app-zip
          path: dist/Bango-unsigned.zip
          if-no-files-found: error
      # Uploaded as a DMG so it keeps its layout. GitHub still wraps any artifact in a zip.
      - uses: actions/upload-artifact@v4
        with:
          name: Bango-${{ steps.meta.outputs.name }}-DMG
          path: dist/Bango-*-unsigned.dmg
          if-no-files-found: error

  # A pushed version tag such as v1.2.0, or a manual run with "release" ticked, publishes a GitHub release with the DMG once both jobs above pass.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [core-tests, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Bango-*-DMG
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $VERSION" >&2
            exit 1
          fi
          awk -v v="$VERSION" '$0 == "## " v { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > notes.md
          {
            echo "Download the DMG below, open it and drag Bango to Applications."
            echo "This build is not notarized yet: the first time, right-click Bango, choose Open, then Open again."
            echo
            cat notes.md
          } > release.md
          ls dist
          gh release create "$TAG" dist/*.dmg --target "$GITHUB_SHA" --title "Bango $VERSION" --notes-file release.md
